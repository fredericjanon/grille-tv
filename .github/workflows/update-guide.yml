name: Mettre à jour le guide TV

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "43 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construire le guide
        env:
          # Facultatif : clé gratuite TMDB pour les affiches des films et séries
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Facultatif : adresse du flux XMLTV si elle change
          FEED_URL: ${{ vars.FEED_URL }}
        run: python scripts/build_guide.py

      - name: Publier
        run: |
          git config user.name "guide-bot"
          git config user.email "guide-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Mise à jour du guide TV" && git push)
