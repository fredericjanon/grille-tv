<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grille TV">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Ma Grille TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Identité : noir profond et formes arrondies translucides bleu / violet / magenta / orange, repris du logo TV. Layout : barre d'outils compacte + panneau timeline pleine hauteur (chaînes collées à gauche, règle horaire collée en haut), fiche programme en feuille modale. */
:root{
 --bg:#04070d;--surface:#0b101a;--surface-2:#131a2a;--line:#1e2742;--grid:#111827;
 --fg:#f4f6fb;--fg-2:#a9b3ca;--fg-3:#6d7894;--accent:#f4f6fb;--on-accent:#04070d;--tint:20%;
 --b1:#3da5ff;--b2:#6c4cff;--b3:#d84fe6;--b4:#ff9a2e;--b5:#ffd23f;
 --brand:linear-gradient(115deg,#3b7bff 0%,#7a4dff 48%,#d04be0 100%);--on-brand:#ffffff;
 --brand-wide:linear-gradient(180deg,#3da5ff 0%,#6c4cff 35%,#d84fe6 70%,#ff9a2e 100%);
 --glow:radial-gradient(46% 34% at 6% -4%,rgba(61,165,255,.24),transparent 70%),radial-gradient(40% 34% at 62% -8%,rgba(216,79,230,.20),transparent 70%),radial-gradient(34% 30% at 100% 6%,rgba(255,154,46,.15),transparent 70%);
 --c-film:#ff5a78;--c-serie:#8a70ff;--c-show:#e24ff0;--c-info:#9fb2cf;--c-mag:#ffd23f;--c-doc:#2fd6b0;--c-sport:#a4e04a;--c-jeune:#ff9a2e;--c-musique:#35d4f2;
 --chanW:96px;--rowH:70px;--trackW:6480px;
 --font-display:"Nunito","Instrument Sans",system-ui,sans-serif;
 --font-body:"Instrument Sans",system-ui,-apple-system,sans-serif;
 color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
 --bg:#eceff8;--surface:#ffffff;--surface-2:#f3f5fb;--line:#d9dff0;--grid:#e8ebf6;
 --fg:#0c1020;--fg-2:#475170;--fg-3:#79829f;--accent:#0c1020;--on-accent:#ffffff;--tint:14%;
 --glow:radial-gradient(46% 34% at 6% -4%,rgba(61,165,255,.22),transparent 70%),radial-gradient(40% 34% at 62% -8%,rgba(216,79,230,.16),transparent 70%),radial-gradient(34% 30% at 100% 6%,rgba(255,154,46,.16),transparent 70%);
 --c-film:#e0344f;--c-serie:#5b44e6;--c-show:#bf2ccf;--c-info:#5d7394;--c-mag:#b8860b;--c-doc:#0e9c80;--c-sport:#5b9a14;--c-jeune:#e0720a;--c-musique:#0a93b4;
 color-scheme:light}}
:root[data-theme="light"]{
 --bg:#eceff8;--surface:#ffffff;--surface-2:#f3f5fb;--line:#d9dff0;--grid:#e8ebf6;
 --fg:#0c1020;--fg-2:#475170;--fg-3:#79829f;--accent:#0c1020;--on-accent:#ffffff;--tint:14%;
 --glow:radial-gradient(46% 34% at 6% -4%,rgba(61,165,255,.22),transparent 70%),radial-gradient(40% 34% at 62% -8%,rgba(216,79,230,.16),transparent 70%),radial-gradient(34% 30% at 100% 6%,rgba(255,154,46,.16),transparent 70%);
 --c-film:#e0344f;--c-serie:#5b44e6;--c-show:#bf2ccf;--c-info:#5d7394;--c-mag:#b8860b;--c-doc:#0e9c80;--c-sport:#5b9a14;--c-jeune:#e0720a;--c-musique:#0a93b4;
 color-scheme:light}
@media (max-width:700px){:root{--chanW:72px}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
img{max-width:100%}
body{margin:0;background-color:var(--bg);background-image:var(--glow);background-repeat:no-repeat;color:var(--fg);font:400 14px/1.4 var(--font-body);
 padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
 display:flex;flex-direction:column;gap:12px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.c-film{--cat:var(--c-film)}.c-serie{--cat:var(--c-serie)}.c-show{--cat:var(--c-show)}.c-info{--cat:var(--c-info)}.c-mag{--cat:var(--c-mag)}.c-doc{--cat:var(--c-doc)}.c-sport{--cat:var(--c-sport)}.c-jeune{--cat:var(--c-jeune)}.c-musique{--cat:var(--c-musique)}
.prog,.lg,.pill,.nx{--lbl:color-mix(in srgb,var(--cat) 68%,var(--fg))}

/* En-tête */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;flex-wrap:wrap}
.logo{display:block;height:54px;width:auto;filter:drop-shadow(0 6px 16px rgba(124,77,255,.38))}
.brand-txt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.grad{background:var(--brand-wide);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.brand h1{font:900 28px/1 var(--font-display);letter-spacing:-.01em;margin:0}
.clock{color:var(--fg-2);font-variant-numeric:tabular-nums}
.clock::first-letter{text-transform:uppercase}
.demo.ok{border-style:solid;border-color:var(--line)}
.art,.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.credit{margin:0;color:var(--fg-3);font-size:11.5px}
.demo{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1px dashed var(--fg-3);color:var(--fg-2);font-size:11.5px;font-weight:600}
.search{position:relative;flex:0 1 280px;min-width:180px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg-3);pointer-events:none}
.search input{width:100%;height:42px;padding:0 14px 0 40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:400 16px var(--font-body);outline:none}
.search input:focus-visible{border-color:var(--fg-2)}
.bar2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.seg{display:flex;gap:4px;padding:4px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line);overflow-x:auto;max-width:100%}
.seg button{height:36px;padding:0 16px;border-radius:14px;font-family:var(--font-display);font-size:14px;font-weight:800;border:0;background:transparent;color:var(--fg-2);font-weight:600;white-space:nowrap;transition:background .18s,color .18s}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);box-shadow:0 6px 18px -6px #7a4dff}
.navs{display:flex;gap:6px;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:15px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--font-display);font-weight:800;font-size:14px;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn.sq{width:44px;height:44px;padding:0}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent;box-shadow:0 10px 24px -10px #7a4dff}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn:focus-visible,.seg button:focus-visible,.lg:focus-visible,.nx:focus-visible,.x:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.legend{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;align-items:center;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.lg{flex:none;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);font-family:var(--font-display);font-weight:800;font-size:13px;transition:background .18s,border-color .18s,color .18s}
.lg.all[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:transparent}
.lg i{width:10px;height:10px;border-radius:50%;background:var(--cat)}
.lg[aria-pressed="true"]{border-color:var(--cat);background:color-mix(in srgb,var(--cat) 18%,var(--surface));color:var(--fg)}
.count{flex:none;margin-left:6px;color:var(--fg-3);font-size:12px;font-variant-numeric:tabular-nums}

/* Timeline */
.panel{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:28px;background:var(--surface);overflow:hidden;box-shadow:0 30px 80px -40px rgba(108,76,255,.55)}
.scroller{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;user-select:none;-webkit-user-select:none}
.grid{position:relative;width:calc(var(--chanW) + var(--trackW))}
.ruler{position:sticky;top:0;z-index:6;display:flex;height:44px;background:var(--surface);border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:7;flex:none;width:var(--chanW);background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;padding-left:12px;font:700 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.ticks{position:relative;flex:none;height:100%;width:var(--trackW)}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding:7px 0 0 8px;font:600 12.5px var(--font-body);color:var(--fg-2);font-variant-numeric:tabular-nums}
.tick.h{top:auto;height:10px;padding:0;border-left-color:var(--grid)}
.nowpill{position:absolute;top:8px;transform:translateX(-50%);background:var(--brand);color:var(--on-brand);font:800 12px var(--font-display);box-shadow:0 6px 16px -6px #d04be0;padding:4px 9px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.now{position:absolute;top:44px;bottom:0;width:3px;margin-left:-1.5px;border-radius:3px;background:var(--brand-wide);box-shadow:0 0 14px rgba(216,79,230,.55);z-index:3;pointer-events:none}
.row{display:flex;height:var(--rowH)}
.chan{position:sticky;left:0;z-index:4;flex:none;width:var(--chanW);display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 10px 0 12px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.num{font:700 11px var(--font-body);color:var(--fg-3);font-variant-numeric:tabular-nums}
.cn{font:800 14px/1.15 var(--font-display);overflow-wrap:anywhere}
.track{position:relative;flex:none;width:var(--trackW);border-bottom:1px solid var(--line);background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:calc(4.5px * 60) 100%}
.prog{position:absolute;top:6px;bottom:6px;padding:0 10px;border-radius:15px;background:linear-gradient(135deg,color-mix(in srgb,var(--cat) calc(var(--tint) + 8%),var(--surface)),color-mix(in srgb,var(--cat) calc(var(--tint) - 6%),var(--surface)));border:1px solid color-mix(in srgb,var(--cat) 34%,transparent);cursor:pointer;outline:none;transition:transform .18s,box-shadow .18s,opacity .2s,filter .2s}
.prog .in{position:sticky;left:calc(var(--chanW) + 10px);display:flex;flex-direction:column;justify-content:center;gap:3px;height:100%;width:max-content;max-width:min(100%,240px);min-width:0}
.prog .t{min-width:0;font:800 14px/1.2 var(--font-display);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prog .m{font:600 11.5px var(--font-body);color:var(--lbl);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog.xs .in{display:none}
.prog.live{background:linear-gradient(135deg,color-mix(in srgb,var(--cat) 44%,var(--surface)),color-mix(in srgb,var(--cat) 24%,var(--surface)));border-color:var(--cat);box-shadow:0 8px 22px -12px var(--cat)}
.prog.past{opacity:.5}
.prog.dim{opacity:.16;filter:saturate(.3)}
.prog .bar{position:absolute;left:10px;right:10px;bottom:5px;height:3px;border-radius:3px;background:color-mix(in srgb,var(--cat) 25%,transparent)}
.prog .bar i{display:block;height:100%;border-radius:3px;background:var(--cat);width:var(--p,0%)}
.prog:not(.live) .bar{display:none}
.prog:active{transform:scale(.985)}
.prog:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
@media (hover:hover){.prog:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px var(--cat)}}

/* Fiche programme */
.scrim{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(4,6,10,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:relative;width:min(920px,100%);max-height:100%;min-height:min(500px,100%);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:34px;overflow:hidden;box-shadow:0 40px 100px -30px rgba(0,0,0,.7),0 0 0 1px color-mix(in srgb,var(--cat) 18%,transparent);transform:translateY(18px) scale(.97);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.scrim.open .sheet{transform:none}
.poster{position:relative;background:#0b0e13;min-height:200px}
.poster svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;left:14px;bottom:12px;font:600 11px var(--font-body);color:rgba(255,255,255,.75);letter-spacing:.04em}
.body{display:flex;flex-direction:column;gap:14px;padding:28px;overflow:auto;min-width:0}
.x{position:absolute;top:14px;right:14px;z-index:3;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.r1{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-right:52px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--cat) 20%,var(--surface));color:var(--lbl);font:900 11.5px var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--cat)}
.st{font:600 13px var(--font-body);color:var(--fg-2)}
.st.live{color:var(--fg);display:inline-flex;align-items:center;gap:7px}
.st.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c-film);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.body h2{margin:0;font:900 34px/1.05 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.ep{margin:-6px 0 0;color:var(--fg-2);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--fg-2);font-variant-numeric:tabular-nums}
.chn{display:inline-flex;align-items:center;gap:8px;color:var(--fg);font-weight:700}
.chn b{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:12px}
.pbar{height:5px;border-radius:5px;background:color-mix(in srgb,var(--cat) 22%,transparent)}
.pbar i{display:block;height:100%;border-radius:5px;background:var(--cat)}
.desc{margin:0;max-width:62ch;font-size:15.5px;line-height:1.55;color:var(--fg)}
.facts{margin:-6px 0 0;color:var(--fg-2);font-variant-numeric:tabular-nums}
.score{margin-left:10px;padding:2px 8px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);font-weight:700;font-size:12.5px;white-space:nowrap}
.cred{margin:0;display:grid;gap:10px}
.cred div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:baseline}
.cred dt{font:700 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.cred dd{margin:0;line-height:1.45}
@media (max-width:420px){.cred div{grid-template-columns:1fr;gap:2px}}
.navrow{display:flex;align-items:stretch;gap:8px;margin-top:auto}
.navrow .sq{flex:none;width:52px;height:auto;min-height:60px;border-radius:16px}
.nx{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);text-align:left}
.nx i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--cat)}
.nx span{min-width:0;flex:1}.nx small{display:block;color:var(--fg-3);font-weight:600;font-variant-numeric:tabular-nums}.nx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:720px){
 .scrim{place-items:end center}
 .sheet{grid-template-columns:1fr;grid-template-rows:190px minmax(0,1fr);border-radius:26px 26px 0 0;max-height:94%}
 .body{padding:20px}.body h2{font-size:26px}
}
/* Écran de lancement */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:20px;background-color:var(--bg);background-image:var(--glow);background-repeat:no-repeat;transition:opacity .4s ease,visibility .4s}
.splash.out{opacity:0;visibility:hidden}
.splash-mark{position:relative;display:grid;place-items:center}
.splash-mark::before{content:"";position:absolute;width:150%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(124,77,255,.45),rgba(216,79,230,.18) 55%,transparent 72%);animation:halo 2s ease-in-out infinite}
.splash-logo{position:relative;width:min(44vw,190px);height:auto;filter:drop-shadow(0 18px 40px rgba(124,77,255,.5));animation:pop .95s cubic-bezier(.2,.9,.3,1.25) both,bob 1.6s ease-in-out .95s infinite}
.splash-title{font:900 30px/1 var(--font-display);letter-spacing:-.01em;animation:rise .6s .4s both}
.splash-bar{width:150px;height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden;animation:rise .6s .5s both}
.splash-bar i{display:block;height:100%;border-radius:5px;background:var(--brand);transform-origin:left center;animation:fill 2s linear both}
@keyframes pop{from{opacity:0;transform:scale(.55) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-7px) scale(1.03)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes halo{50%{transform:scale(1.12);opacity:.75}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="splash" id="splash" role="status" aria-label="Chargement">
 <div class="splash-mark"><img class="splash-logo" src="logo.png" alt="" width="190" height="162"></div>
 <div class="splash-title">Ma Grille <span class="grad">TV</span></div>
 <div class="splash-bar"><i></i></div>
</div>
<div class="top">
 <div class="brand"><img class="logo" src="logo.png" alt="" width="63" height="54"><div class="brand-txt"><h1>Ma Grille <span class="grad">TV</span></h1><span class="clock" id="clock"></span><span class="demo" id="pill">Chargement…</span></div></div>
 <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Rechercher un programme" aria-label="Rechercher un programme" enterkeyhint="search"></label>
</div>
<div class="bar2">
 <div class="seg" id="days" role="group" aria-label="Jour"></div>
 <div class="navs">
  <button class="btn sq" data-nav="-120" aria-label="Reculer de deux heures"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="btn" data-nav="now">Maintenant</button>
  <button class="btn" data-nav="eve">Ce soir</button>
  <button class="btn sq" data-nav="120" aria-label="Avancer de deux heures"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
 </div>
</div>
<div class="legend" id="legend" role="group" aria-label="Catégories"></div>
<div class="panel"><div class="scroller" id="scroller"><div class="grid" id="grid"></div></div></div>

<div class="scrim" id="scrim" hidden>
 <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">

  +'<linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:'+deep+'"/><stop offset="1" style="stop-color:'+mid+'"/></linearGradient>'
  +'<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:'+hi+';stop-opacity:.55"/><stop offset="1" style="stop-color:'+hi+';stop-opacity:0"/></linearGradient>'
  +'<linearGradient id="vg" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" style="stop-color:#000;stop-opacity:0"/><stop offset="1" style="stop-color:#000;stop-opacity:.55"/></linearGradient></defs>'
  +'<rect width="640" height="480" fill="url(#pbg)"/>'+g+'<rect width="640" height="480" fill="url(#vg)"/></svg>';
}

/* ---------- Application ---------- */
const $=id=>document.getElementById(id);
const grid=$("grid"),scroller=$("scroller"),scrim=$("scrim"),sheet=$("sheet"),mbody=$("mbody"),mposter=$("mposter"),qEl=$("q");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
/* Écran de lancement : 2 secondes à l'ouverture de l'app (une fois par session) */
const SPLASH_ALWAYS=false;
(function(){
 const sp=document.getElementById("splash");if(!sp)return;
 let show=true;
 try{if(!SPLASH_ALWAYS&&sessionStorage.getItem("splash-vu"))show=false;else sessionStorage.setItem("splash-vu","1")}catch(e){}
 if(!show){sp.remove();return}
 setTimeout(()=>{sp.classList.add("out");setTimeout(()=>sp.remove(),450)},2000);
})();
const state={day:0,cats:new Set()};
const DAYS=[],ITEMS=new Map();
const ICON={
 prev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 next:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
};
function baseDate(){const n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),n.getDate());if(n.getHours()<6)d.setDate(d.getDate()-1);return d}
function nowMin(){const n=new Date();let m=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;if(n.getHours()<6)m+=1440;return m}
function dateOf(d){const x=baseDate();x.setDate(x.getDate()+d);return x}
function dateKey(d){const x=dateOf(d);return x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())}
function dayLabel(d,long){if(d===0)return "Aujourd'hui";if(d===1)return "Demain";return new Intl.DateTimeFormat("fr-FR",long?{weekday:"long",day:"numeric"}:{weekday:"short",day:"numeric"}).format(dateOf(d))}
let LIVE=null;
function getDay(d){
 if(DAYS[d])return DAYS[d];
 const m=new Map();
 if(LIVE){
  const mid=dateOf(d).getTime()/1000,lo=mid+START*60,hi=mid+END*60;
  LIVE.channels.forEach(c=>{
   const l=[];
   c.p.forEach(p=>{if(p[1]>lo&&p[0]<hi){
    const it={id:c.id+"-"+p[0]+"-"+d,ch:c.id,d,start:Math.round((p[0]-mid)/60),end:Math.round((p[1]-mid)/60),title:p[2],desc:p[3]||"",cat:p[4],ep:p[5]||"",img:p[6]||"",bg:p[7]||"",x:p[8]||null};
    it.dur=it.end-it.start;ITEMS.set(it.id,it);l.push(it);
   }});
   m.set(c.id,l);
  });
 }else{
  const k=dateKey(d);
  CHANNELS.forEach(ch=>{const l=buildDay(ch,d,k);l.forEach(i=>ITEMS.set(i.id,i));m.set(ch.id,l)});
 }
 return DAYS[d]=m;
}
async function loadGuide(){
 try{
  const r=await fetch("data/guide.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const g=await r.json();
  if(!g.channels||!g.channels.length)throw new Error("vide");
  LIVE=g;CHANNELS=g.channels.map(c=>({id:c.id,n:c.n,name:c.name})).sort((a,b)=>a.n-b.n);
  CH={};CHANNELS.forEach(c=>CH[c.id]=c);
 }catch(e){LIVE=null}
}
function dayCount(){
 if(!LIVE)return 5;
 let n=0;
 for(let d=0;d<10;d++){if(dateOf(d).getTime()/1000+START*60<LIVE.last)n=d+1}
 return Math.max(1,n);
}
const listOf=it=>getDay(it.d).get(it.ch);

/* Rendu de la grille */
function rowHTML(ch,list){
 let h='<div class="row"><div class="chan"><span class="num">'+ch.n+'</span><span class="cn">'+esc(ch.name)+'</span></div><div class="track">';
 list.forEach(it=>{
  const ls=Math.max(it.start,START),le=Math.min(it.end,END),w=(le-ls)*PPM-4,left=(ls-START)*PPM+2;
  const size=w<56?" xs":"";
  const meta=fmt(it.start)+(w>=120?" · "+CATS[it.cat]:"");
  h+='<div class="prog c-'+it.cat+size+'" role="button" tabindex="0" data-id="'+it.id+'" style="left:'+left+"px;width:"+w+'px" aria-label="'+esc(it.title+", "+ch.name+", "+fmt(it.start)+" à "+fmt(it.end)+", "+CATS[it.cat])+'">'
   +'<div class="in"><span class="t">'+esc(it.title)+'</span><span class="m">'+meta+'</span></div>'
   +'<span class="bar"><i></i></span></div>';
 });
 return h+"</div></div>";
}
function rulerHTML(){
 let t="";
 for(let m=START;m<=END;m+=30){
  const x=(m-START)*PPM;
  t+=m%60===0?'<div class="tick" style="left:'+x+'px">'+fmt(m)+"</div>":'<div class="tick h" style="left:'+x+'px"></div>';
 }
 return '<div class="ruler"><div class="corner">Chaînes</div><div class="ticks">'+t+'<span class="nowpill" id="nowpill" hidden></span></div></div>';
}
function renderDay(){
 const lists=getDay(state.day);let rows="";
 CHANNELS.forEach(ch=>rows+=rowHTML(ch,lists.get(ch.id)));
 grid.style.setProperty("--trackW",(END-START)*PPM+"px");
 grid.innerHTML=rulerHTML()+rows+'<div class="now" id="nowline" hidden></div>';
 applyFilters();refreshNow();
}
function refreshNow(){
 const n=nowMin();
 grid.querySelectorAll(".prog").forEach(el=>{
  const it=ITEMS.get(el.dataset.id),s=it.start+it.d*1440,e=it.end+it.d*1440;
  const live=s<=n&&n<e;
  el.classList.toggle("live",live);el.classList.toggle("past",e<=n);
  if(live)el.style.setProperty("--p",((n-s)/(e-s)*100).toFixed(1)+"%");
 });
 const rel=n-state.day*1440,x=(rel-START)*PPM,vis=rel>=START&&rel<=END;
 const line=$("nowline"),pill=$("nowpill");
 if(line&&pill){
  line.hidden=!vis;pill.hidden=!vis;
  if(vis){line.style.left="calc(var(--chanW) + "+x+"px)";pill.style.left=x+"px";pill.textContent=fmt(Math.floor(rel))}
 }
 const d=new Date();
 $("clock").textContent=new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"}).format(d)+" · "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function applyFilters(){
 const q=norm(qEl.value.trim()),cs=state.cats;let n=0;
 grid.querySelectorAll(".prog").forEach(el=>{
  const it=ITEMS.get(el.dataset.id);
  const ok=(!cs.size||cs.has(it.cat))&&(!q||norm(it.title+" "+CATS[it.cat]+" "+it.desc+" "+(it.x?[].concat(it.x.d||[],it.x.cr||[],it.x.a||[]).join(" "):"")).includes(q));
  el.classList.toggle("dim",!ok);if(ok)n++;
 });
 const c=$("count");
 if(c){c.textContent=(cs.size||q)?n+" programme"+(n>1?"s":""):"";}
}

/* Défilement */
function scrollToMin(m,smooth){
 const left=Math.max(0,(m-START)*PPM-(scroller.clientWidth-grid.querySelector(".corner").offsetWidth)*.25);
 scroller.scrollTo({left,behavior:smooth&&!reduce?"smooth":"auto"});
}
function goNow(smooth){if(state.day===0)scrollToMin(Math.max(START,nowMin()-30),smooth);else scrollToMin(1170,smooth)}
function jumpFirst(){
 const q=qEl.value.trim();if(!q&&!state.cats.size)return;
 const n=nowMin()-state.day*1440;let best=null;
 grid.querySelectorAll(".prog:not(.dim)").forEach(el=>{const it=ITEMS.get(el.dataset.id);if(it.end>n&&(!best||it.start<best.it.start))best={el,it}});
 if(best){
  const row=best.el.closest(".row");
  scroller.scrollTo({left:Math.max(0,(best.it.start-START)*PPM-80),top:Math.max(0,row.offsetTop-80),behavior:reduce?"auto":"smooth"});
 }
}

/* Fiche programme */
function factsHTML(it){
 const x=it.x;if(!x)return"";
 const f=[];
 if(x.y)f.push(x.y);
 if(x.g&&x.g.length)f.push(x.g.map(esc).join(", "));
 if(x.co&&x.co.length)f.push(x.co.map(esc).join(", "));
 if(x.r)f.push(/^-\d+$/.test(x.r)?"-"+x.r.slice(1)+" ans":/^TP$/i.test(x.r)?"Tous publics":esc(x.r));
 return f.length?'<p class="facts">'+f.join(" · ")+(x.n?'<span class="score">★ '+x.n.toFixed(1).replace(".",",")+"</span>":"")+"</p>":"";
}
function credHTML(it){
 const x=it.x;if(!x)return"";
 const row=(k,v)=>v&&v.length?"<div><dt>"+k+"</dt><dd>"+v.map(esc).join(", ")+"</dd></div>":"";
 const h=row("Réalisation",x.d)+row("Création",x.cr)+row("Avec",(x.a||[]).slice(0,6));
 return h?'<dl class="cred">'+h+"</dl>":"";
}
let lastFocus=null,current=null;
function statusOf(it){
 const n=nowMin(),s=it.start+it.d*1440,e=it.end+it.d*1440;
 if(s<=n&&n<e){const left=Math.ceil(e-n);return{cls:"live",txt:"En direct · encore "+fmtDur(left),p:(n-s)/(e-s)*100}}
 if(e<=n)return{cls:"",txt:"Terminé"};
 const diff=Math.round(s-n);
 if(diff<720)return{cls:"",txt:"Dans "+fmtDur(diff)};
 return{cls:"",txt:dayLabel(it.d,true)+" à "+fmt(it.start)};
}
function openProg(id){
 const it=ITEMS.get(id);if(!it)return;
 const ch=CH[it.ch],list=listOf(it),i=list.indexOf(it),prev=list[i-1],next=list[i+1],st=statusOf(it);
 current=it;
 sheet.className="sheet c-"+it.cat;
 const url=it.img||it.bg,tm=/tmdb\.org/.test(url||"")||!!(it.x&&it.x.s==="t");
 mposter.innerHTML=poster(it)
  +(url?'<picture class="art">'+(it.bg?'<source media="(max-width:720px)" srcset="'+esc(it.bg)+'">':"")+'<img src="'+esc(url)+'" alt="" referrerpolicy="no-referrer"></picture>':"")
  +'<span class="cap">'+(url?(/tmdb\.org/.test(url)?"Visuel : TMDB":"Visuel : guide TV"):"Visuel illustratif")+"</span>";
 const im=mposter.querySelector("img");if(im)im.addEventListener("error",()=>{const pc=im.closest("picture");if(pc)pc.remove();mposter.querySelector(".cap").textContent="Visuel illustratif"});
 mbody.innerHTML=
  '<div class="r1"><span class="pill"><i></i>'+CATS[it.cat]+'</span><span class="st '+st.cls+'">'+esc(st.txt)+"</span></div>"
  +'<h2 id="m-title">'+esc(it.title)+"</h2>"
  +(it.ep?'<p class="ep">'+esc(it.ep)+"</p>":"")
  +factsHTML(it)
  +'<div class="meta"><span class="chn"><b>'+ch.n+"</b>"+esc(ch.name)+"</span><span>"+fmt(it.start)+" – "+fmt(it.end)+"</span><span>"+fmtDur(it.dur)+"</span></div>"
  +(st.cls==="live"?'<div class="pbar"><i style="width:'+st.p.toFixed(0)+'%"></i></div>':"")
  +'<p class="desc">'+esc(it.desc)+"</p>"
  +credHTML(it)
  +(prev||next?'<div class="navrow"><button class="btn sq" data-act="go" data-id="'+(prev?prev.id:"")+'" aria-label="Programme précédent"'+(prev?"":" disabled")+">"+ICON.prev+"</button>"
   +(next?'<button class="nx c-'+next.cat+'" data-act="go" data-id="'+next.id+'"><i></i><span><small>Ensuite · '+fmt(next.start)+"</small><b>"+esc(next.title)+"</b></span>"+ICON.next+"</button>":"")+"</div>":"")
  +(tm?'<p class="credit">Ce produit utilise l\'API TMDB mais n\'est ni approuvé ni certifié par TMDB.</p>':"");
 mbody.scrollTop=0;
 if(scrim.hidden){
  lastFocus=document.activeElement;scrim.hidden=false;void scrim.offsetWidth;scrim.classList.add("open");$("mx").focus({preventScroll:true});
 }
}
function closeProg(){
 if(scrim.hidden)return;
 scrim.classList.remove("open");
 setTimeout(()=>{scrim.hidden=true;current=null;if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})},reduce?0:200);
}

/* Interface */
function buildUI(){
 const seg=$("days");
 for(let d=0,n=dayCount();d<n;d++){const b=document.createElement("button");b.textContent=dayLabel(d);b.setAttribute("aria-pressed",d===0);b.dataset.day=d;seg.appendChild(b)}
 const lg=$("legend");
 const all=document.createElement("button");all.className="lg all";all.dataset.cat="";all.setAttribute("aria-pressed","true");all.textContent="Tous";lg.appendChild(all);
 Object.keys(CATS).forEach(k=>{const b=document.createElement("button");b.className="lg c-"+k;b.dataset.cat=k;b.setAttribute("aria-pressed","false");b.innerHTML="<i></i>"+CATS[k];lg.appendChild(b)});
 const c=document.createElement("span");c.className="count";c.id="count";c.setAttribute("aria-live","polite");lg.appendChild(c);
}
$("days").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 state.day=+b.dataset.day;
 $("days").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
 renderDay();scroller.scrollTo({top:0,left:0});requestAnimationFrame(()=>goNow(false));
});
$("legend").addEventListener("click",e=>{
 const b=e.target.closest(".lg");if(!b)return;
 const k=b.dataset.cat;
 if(!k)state.cats.clear();else state.cats.has(k)?state.cats.delete(k):state.cats.add(k);
 $("legend").querySelectorAll(".lg").forEach(x=>x.setAttribute("aria-pressed",x.dataset.cat?state.cats.has(x.dataset.cat):state.cats.size===0));
 applyFilters();
});
document.querySelector(".navs").addEventListener("click",e=>{
 const b=e.target.closest("[data-nav]");if(!b)return;
 const v=b.dataset.nav;
 if(v==="now"){state.day===0?goNow(true):$("days").querySelector('[data-day="0"]').click()}
 else if(v==="eve")scrollToMin(1170,true);
 else scroller.scrollBy({left:+v*PPM,behavior:reduce?"auto":"smooth"});
});
qEl.addEventListener("input",applyFilters);
qEl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();jumpFirst();qEl.blur()}});
grid.addEventListener("click",e=>{const el=e.target.closest(".prog");if(el)openProg(el.dataset.id)});
grid.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const el=e.target.closest(".prog");if(el){e.preventDefault();openProg(el.dataset.id)}}});
scrim.addEventListener("click",e=>{if(e.target===scrim)closeProg()});
$("mx").addEventListener("click",closeProg);
mbody.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
 if(b.dataset.id)openProg(b.dataset.id);
});
document.addEventListener("keydown",e=>{
 if(scrim.hidden)return;
 if(e.key==="Escape"){closeProg();return}
 if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
  const l=listOf(current),i=l.indexOf(current),t=l[i+(e.key==="ArrowRight"?1:-1)];if(t)openProg(t.id);return;
 }
 if(e.key==="Tab"){
  const f=[...sheet.querySelectorAll("button:not([disabled])")];if(!f.length)return;
  const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
  else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
 }
});
(async function start(){
 await loadGuide();
 const pill=$("pill");
 if(LIVE){
  const g=new Date(LIVE.generated);
  pill.textContent="Guide mis à jour "+new Intl.DateTimeFormat("fr-FR",{weekday:"short",hour:"2-digit",minute:"2-digit"}).format(g);
  pill.classList.add("ok");
 }else pill.textContent="Mode démo · guide non chargé";
 buildUI();
 renderDay();
 requestAnimationFrame(()=>goNow(false));
 setInterval(refreshNow,20000);
 if(LIVE&&LIVE.tmdb)document.title="Ma Grille TV";
})();

})();
</script>
</body>
